    <script>
      // Suppress WebSocket and HMR errors in preview environment per system guidelines
      window.addEventListener('error', function(e) {
        if (e && e.message && (
          e.message.indexOf('WebSocket') !== -1 || 
          e.message.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
          e.message.indexOf('@vite/client') !== -1
        )) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e && (e.reason ? (e.reason.message || String(e.reason)) : '');
        if (reason && (
          reason.indexOf('WebSocket') !== -1 || 
          reason.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
          reason.indexOf('@vite/client') !== -1
        )) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
    </script>
